<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ROBOROVER AI</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;800&display=swap" rel="stylesheet">
    <style>
        :root { --p: #00d2ff; --a: #ff0055; --bg: #0b111a; --card: rgba(255,255,255,0.05); }
        * { margin:0; padding:0; box-sizing:border-box; font-family: 'Outfit'; }
        body { background: var(--bg); color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .dash { width: 90%; max-width: 400px; background: var(--card); padding: 30px; border-radius: 40px; backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.1); }
        .stats { display: flex; gap: 10px; margin: 20px 0; }
        .stat { flex: 1; background: rgba(0,0,0,0.3); padding: 12px; border-radius: 20px; text-align: center; border: 1px solid rgba(255,255,255,0.05); }
        .val { font-size: 1.1rem; font-weight: 800; color: var(--p); }
        .lbl { font-size: 0.6rem; opacity: 0.5; text-transform: uppercase; }
        .pad { display: grid; grid-template-areas: ". u ." "l . r" ". d ."; gap: 12px; justify-content: center; margin-bottom: 25px; }
        .btn { width: 70px; height: 70px; background: var(--card); border: none; border-radius: 20px; color: #fff; font-size: 1.4rem; cursor: pointer; }
        .btn:active { background: var(--p); color: #000; transform: scale(0.9); }
        .m-row { display: flex; gap: 10px; margin-bottom: 10px; }
        .m-btn { flex: 1; padding: 15px; border-radius: 15px; border: none; font-weight: 800; cursor: pointer; background: rgba(255,255,255,0.1); color: #fff; text-transform: uppercase; }
        .m-btn.active { background: var(--p); color: #000; }
        .lrn { background: #00ffaa !important; color: #000 !important; width: 100%; margin-top: 5px; font-size: 0.8rem;}
        .prd { background: #ffaa00 !important; color: #000 !important; width: 100%; margin-top: 5px; font-size: 0.8rem;}
        .stop { background: var(--a) !important; color: #fff !important; width: 100%; margin-top: 10px; font-size: 1.1rem; }
        #conn { position: fixed; top: 0; width: 100%; padding: 15px; background: var(--p); color: #000; text-align: center; font-weight: 800; cursor: pointer; z-index: 100; }
        .disabled { opacity: 0.1; pointer-events: none; }
    </style>
</head>
<body>
    <div id="conn" onclick="connect()">CONNECT SYSTEM</div>
    <div class="dash">
        <h2 style="text-align:center; margin-bottom: 20px;">ROBO<span style="color:var(--p)">ROVER</span></h2>
        <div class="stats">
            <div class="stat"><div class="val" id="vm">OFF</div><div class="lbl">Mode</div></div>
            <div class="stat"><div class="val" id="va">WAIT</div><div class="lbl">Neural</div></div>
            <div class="stat"><div class="val" id="vd">--</div><div class="lbl">Radar</div></div>
        </div>
        <div class="pad" id="ctrl">
            <button class="btn" id="f" style="grid-area: u">▲</button>
            <button class="btn" id="l" style="grid-area: l">◀</button>
            <button class="btn" id="r" style="grid-area: r">▶</button>
            <button class="btn" id="b" style="grid-area: d">▼</button>
        </div>
        <div class="m-row">
            <button class="m-btn active" id="bm" onclick="send('M')">Manual</button>
            <button class="m-btn" id="ba" onclick="send('A')">Auto</button>
        </div>
        <button class="m-btn lrn" onclick="send('LN')">START LEARNING LAP</button>
        <button class="m-btn prd" onclick="send('PR')">FORCE PREDICT MODE</button>
        <button class="m-btn stop" id="halt-btn">HALT SYSTEM</button>
    </div>
    <script>
        const SVC="4fafc201-1fb5-459e-8fcc-c5c9c331914b", CHR="beb5483e-36e1-4688-b7f5-ea07361b26a8";
        let char, curM='M';
        let isWriting = false, msgQueue = [];
        let wakeLock = null;

        async function requestWakeLock() {
            try { wakeLock = await navigator.wakeLock.request('screen'); } 
            catch (err) { console.error(err); }
        }

        document.addEventListener('visibilitychange', () => {
            if (wakeLock !== null && document.visibilityState === 'visible') requestWakeLock();
        });

        async function connect() {
            try {
                const dev = await navigator.bluetooth.requestDevice({ filters: [{ name: 'ROBOROVER_BLE' }], optionalServices: [SVC] });
                const srv = await dev.gatt.connect();
                const sc = await srv.getPrimaryService(SVC);
                char = await sc.getCharacteristic(CHR);
                document.getElementById('conn').style.display='none';
                
                await requestWakeLock();

                char.startNotifications();
                char.addEventListener('characteristicvaluechanged', e => {
                    const val = new TextDecoder().decode(e.target.value);
                    if(val.startsWith("MSG:")) { console.log(val); return; }
                    const [m, d, a] = val.split(',');
                    curM = m;
                    document.getElementById('vm').innerText = m=='M'?'MANUAL':'AUTO';
                    document.getElementById('va').innerText = a=='LRN'?'LEARN':(a=='REC'?'RECORD':'PREDICT');
                    document.getElementById('vd').innerText = d+'cm';
                    document.getElementById('ba').classList.toggle('active', m=='A');
                    document.getElementById('bm').classList.toggle('active', m=='M');
                    document.getElementById('ctrl').classList.toggle('disabled', m=='A');
                });
            } catch (e) { alert(e); }
        }

        async function send(s) {
            if(!char) return;
            msgQueue.push(s); 
            if(isWriting) return;
            isWriting = true;
            while(msgQueue.length > 0) {
                let toSend = msgQueue.shift();
                try { await char.writeValue(new TextEncoder().encode(toSend)); } catch(exc) {}
            }
            isWriting = false;
        }

        const bind = (id, s) => {
            const el = document.getElementById(id);
            el.onpointerdown = (e) => { e.preventDefault(); if(curM=='M') send(s); };
            el.onpointerup = (e) => { e.preventDefault(); if(curM=='M') send('S'); };
            el.onpointerleave = (e) => { e.preventDefault(); if(curM=='M') send('S'); };
        };
        bind('f','F'); bind('b','B'); bind('l','L'); bind('r','R');

        document.getElementById('halt-btn').onpointerdown = (e) => {
            e.preventDefault();
            send('S');
            curM = 'M';
            document.getElementById('vm').innerText = "MANUAL";
            document.getElementById('ctrl').classList.remove('disabled');
            document.getElementById('ba').classList.remove('active');
            document.getElementById('bm').classList.add('active');
        };
    </script>
</body>
</html>
