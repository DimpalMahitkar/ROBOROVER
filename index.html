<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ROBOROVER | Premium Control Pad</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00d2ff;
            --accent: #ff0055;
            --bg: #0b0e14;
            --card: rgba(255, 255, 255, 0.05);
            --text: #ffffff;
            --subtext: #888;
            --btn-bg: rgba(255, 255, 255, 0.08);
            --font: 'Outfit', sans-serif;
        }

        [data-theme="light"] {
            --primary: #00a8cc;
            --bg: #f0f4f8;
            --card: rgba(255, 255, 255, 0.8);
            --text: #1a202c;
            --subtext: #4a5568;
            --btn-bg: rgba(0, 0, 0, 0.05);
        }

        * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
        body { 
            font-family: var(--font); background: var(--bg); color: var(--text); 
            height: 100vh; display: flex; align-items: center; justify-content: center;
            transition: background 0.4s; overflow: hidden;
        }

        .dashboard {
            width: 92%; max-width: 420px; padding: 25px; border-radius: 35px;
            background: var(--card); backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            display: flex; flex-direction: column; gap: 20px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.15);
        }

        .hdr { display: flex; justify-content: space-between; align-items: center; }
        .theme-toggle {
            width: 48px; height: 26px; background: rgba(0,0,0,0.2); border-radius: 13px;
            position: relative; cursor: pointer; border: 1px solid rgba(255,255,255,0.1);
        }
        .theme-toggle::after {
            content: "🌙"; position: absolute; left: 3px; top: 2px;
            width: 20px; height: 20px; border-radius: 50%; background: #fff;
            display: flex; align-items: center; justify-content: center; font-size: 12px;
            transition: 0.3s;
        }
        [data-theme="light"] .theme-toggle::after { transform: translateX(22px); content: "☀️"; }

        .stats { display: flex; gap: 12px; }
        .stat-card {
            flex: 1; padding: 15px; background: rgba(0,0,0,0.05); border-radius: 20px;
            text-align: center; border: 1px solid rgba(255,255,255,0.05);
        }
        .stat-label { font-size: 0.65rem; text-transform: uppercase; color: var(--subtext); }
        .stat-val { font-size: 1.3rem; font-weight: 700; color: var(--primary); margin-top: 5px; }

        /* Directional Pad */
        .dpad-container {
            display: grid;
            grid-template-areas: ". up ." "left . right" ". down .";
            gap: 15px;
            justify-content: center;
            margin: 20px 0;
            perspective: 800px;
        }

        .d-btn {
            width: 80px; height: 80px;
            background: var(--btn-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            color: var(--text);
            font-size: 1.8rem;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 8px 0 rgba(0,0,0,0.1);
        }

        .d-btn:active, .d-btn.pressing {
            transform: translateY(4px);
            background: var(--primary);
            color: #000;
            box-shadow: 0 0 25px var(--primary);
            border-color: var(--primary);
        }

        .btn-group { display: flex; gap: 10px; }
        .m-btn {
            flex: 1; padding: 15px; border-radius: 18px; border: none;
            background: rgba(0,0,0,0.1); color: var(--subtext);
            font-weight: 700; font-size: 0.8rem; cursor: pointer; transition: 0.3s;
        }
        .m-btn.active { background: var(--primary); color: #000; }

        .stop-btn {
            width: 100%; padding: 22px; border-radius: 25px; border: none;
            background: var(--accent); color: #fff; font-size: 1.1rem; font-weight: 700;
            letter-spacing: 2px; cursor: pointer; transition: 0.2s;
            box-shadow: 0 10px 30px rgba(255, 0, 85, 0.2);
        }
        .stop-btn:active { transform: scale(0.95); opacity: 0.9; }

        #conn-msg {
            position: fixed; top: 0; left: 0; width: 100%; padding: 12px;
            background: var(--primary); color: #000; text-align: center; font-weight: 700;
            cursor: pointer; z-index: 1000; transition: 0.5s;
        }
        .hidden { transform: translateY(-100%); }
    </style>
</head>
<body data-theme="dark">
    <div id="conn-msg">TAP TO CONNECT ROBOROVER</div>

    <div class="dashboard">
        <div class="hdr">
            <h2 style="font-weight: 300;">ROBO<span style="font-weight: 700; color: var(--primary);">PAD</span></h2>
            <div class="theme-toggle" id="theme-btn"></div>
        </div>

        <div class="stats">
            <div class="stat-card">
                <div class="stat-label">Mode</div>
                <div class="stat-val" id="mode-text">OFFLINE</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Proximity</div>
                <div class="stat-val" id="dist-text">--</div>
            </div>
        </div>

        <div class="dpad-container" id="dpad">
            <button class="d-btn" style="grid-area: up" data-cmd="F">▲</button>
            <button class="d-btn" style="grid-area: left" data-cmd="L">◀</button>
            <button class="d-btn" style="grid-area: right" data-cmd="R">▶</button>
            <button class="d-btn" style="grid-area: down" data-cmd="B">▼</button>
        </div>

        <div class="btn-group">
            <button class="m-btn active" id="btn-manual" onclick="send('M')">MANUAL</button>
            <button class="m-btn" id="btn-auto" onclick="send('A')">AI AUTO</button>
        </div>

        <button class="stop-btn" onclick="send('S')">IMMEDIATE HALT</button>
    </div>

    <script>
        const SERVICE_UUID = "4fafc201-1fb5-459e-8fcc-c5c9c331914b";
        const CHAR_UUID = "beb5483e-36e1-4688-b7f5-ea07361b26a8";
        let device, char, currentMode = 'M';

        // Theme Toggle
        document.getElementById('theme-btn').onclick = () => {
            const current = document.body.getAttribute('data-theme');
            document.body.setAttribute('data-theme', current === 'dark' ? 'light' : 'dark');
        };

        // BLE Core
        async function connect() {
            try {
                device = await navigator.bluetooth.requestDevice({
                    filters: [{ name: 'ROBOROVER_BLE' }],
                    optionalServices: [SERVICE_UUID]
                });
                const server = await device.gatt.connect();
                const service = await server.getPrimaryService(SERVICE_UUID);
                char = await service.getCharacteristic(CHAR_UUID);
                document.getElementById('conn-msg').classList.add('hidden');
                char.startNotifications();
                char.addEventListener('characteristicvaluechanged', (e) => {
                    const data = new TextDecoder().decode(e.target.value);
                    if (data.startsWith("MSG:")) {
                        document.getElementById('mode-text').innerText = data.replace("MSG:", "");
                    } else {
                        const [mode, dist] = data.split(',');
                        currentMode = mode;
                        document.getElementById('mode-text').innerText = mode == 'M' ? "MANUAL" : "AUTO";
                        document.getElementById('dist-text').innerText = dist + "cm";
                        document.getElementById('btn-auto').classList.toggle('active', mode === 'A');
                        document.getElementById('btn-manual').classList.toggle('active', mode === 'M');
                    }
                });
            } catch (e) { alert("Connect Error: " + e.message); }
        }
        document.getElementById('conn-msg').onclick = connect;

        // D-Pad Control Logic
        const btns = document.querySelectorAll('.d-btn');
        let currentCmd = 'S';

        btns.forEach(btn => {
            const start = (e) => {
                if(currentMode === 'A') return;
                e.preventDefault();
                const cmd = btn.getAttribute('data-cmd');
                if(cmd !== currentCmd) {
                    currentCmd = cmd;
                    send(cmd);
                    btn.classList.add('pressing');
                }
            };
            const stop = (e) => {
                e.preventDefault();
                currentCmd = 'S';
                send('S');
                btn.classList.remove('pressing');
            };

            btn.addEventListener('touchstart', start);
            btn.addEventListener('touchend', stop);
            btn.addEventListener('mousedown', start);
            btn.addEventListener('mouseup', stop);
            btn.addEventListener('mouseleave', stop);
        });

        async function send(cmd) {
            if(!char) return;
            try {
                await char.writeValue(new TextEncoder().encode(cmd));
            } catch(e) {}
        }
    </script>
</body>
</html>
