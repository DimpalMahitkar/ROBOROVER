<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ROBOROVER | Premium Controller</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00d2ff;
            --accent: #ff0055;
            --bg: #0b0e14;
            --card: rgba(255, 255, 255, 0.05);
            --text: #ffffff;
            --subtext: #888;
            --shadow: rgba(0, 210, 255, 0.2);
            --font: 'Outfit', sans-serif;
        }

        [data-theme="light"] {
            --primary: #00a8cc;
            --bg: #f0f4f8;
            --card: rgba(255, 255, 255, 0.7);
            --text: #1a202c;
            --subtext: #4a5568;
            --shadow: rgba(0, 168, 204, 0.1);
        }

        * { margin:0; padding:0; box-sizing:border-box; touch-action:none; -webkit-tap-highlight-color: transparent; }
        body { 
            font-family: var(--font); background: var(--bg); color: var(--text); 
            height: 100vh; display: flex; align-items: center; justify-content: center;
            transition: background 0.5s ease, color 0.5s ease;
        }

        .dashboard {
            width: 90%; max-width: 450px; padding: 30px; border-radius: 40px;
            background: var(--card); backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px rgba(0,0,0,0.1);
            display: flex; flex-direction: column; gap: 20px;
        }

        /* Header & Toggle */
        .hdr { display: flex; justify-content: space-between; align-items: center; }
        .theme-toggle {
            width: 50px; height: 26px; background: rgba(0,0,0,0.2); border-radius: 13px;
            position: relative; cursor: pointer; border: 1px solid rgba(255,255,255,0.1);
        }
        .theme-toggle::after {
            content: "🌙"; position: absolute; left: 3px; top: 2px; font-size: 14px;
            width: 20px; height: 20px; background: #fff; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            transition: 0.3s;
        }
        [data-theme="light"] .theme-toggle::after { transform: translateX(24px); content: "☀️"; }

        /* Stats Section */
        .stats { display: flex; gap: 15px; }
        .stat-card {
            flex: 1; padding: 20px; background: rgba(0,0,0,0.05); border-radius: 25px;
            text-align: center; border: 1px solid rgba(255,255,255,0.05);
        }
        .stat-label { font-size: 0.7rem; text-transform: uppercase; letter-spacing: 1px; color: var(--subtext); }
        .stat-val { font-size: 1.5rem; font-weight: 700; color: var(--primary); margin-top: 5px; }

        /* Joystick Body */
        .ctrl-area { 
            height: 300px; display: flex; flex-direction: column; align-items: center; justify-content: center; 
            position: relative; margin: 10px 0;
        }
        #joy-outer {
            width: 220px; height: 220px; border-radius: 50%;
            background: radial-gradient(circle at center, rgba(255,255,255,0.02) 0%, rgba(0,0,0,0.1) 100%);
            border: 2px dashed rgba(255,255,255,0.1);
            position: relative; display: flex; align-items: center; justify-content: center;
        }
        #joy-knob {
            width: 85px; height: 85px; background: linear-gradient(135deg, var(--primary), #00ffcc);
            border-radius: 50%; box-shadow: 0 10px 40px var(--shadow), inset 0 0 10px rgba(255,255,255,0.3);
            cursor: pointer; position: absolute; transition: transform 0.1s ease-out;
        }

        /* Buttons & Footer */
        .btn-group { display: flex; gap: 12px; }
        .m-btn {
            flex: 1; padding: 18px; border-radius: 20px; border: none;
            background: rgba(0,0,0,0.05); color: var(--subtext);
            font-weight: 600; font-size: 0.8rem; cursor: pointer; transition: 0.3s;
        }
        .m-btn.active { background: var(--primary); color: #fff; box-shadow: 0 10px 20px var(--shadow); }

        .stop-btn {
            width: 100%; padding: 22px; border-radius: 25px; border: none;
            background: var(--accent); color: #fff; font-size: 1.1rem; font-weight: 700;
            letter-spacing: 2px; cursor: pointer; -webkit-appearance: none;
            box-shadow: 0 15px 35px rgba(255, 0, 85, 0.2); transition: 0.2s;
        }
        .stop-btn:active { transform: scale(0.96); box-shadow: 0 5px 15px rgba(255, 0, 85, 0.1); }

        /* Link State */
        #conn-msg {
            position: fixed; top: 0; left: 0; width: 100%; padding: 12px;
            background: var(--primary); color: #fff; text-align: center; font-weight: 700;
            cursor: pointer; z-index: 1000; filter: drop-shadow(0 5px 15px var(--shadow));
            transition: 0.5s;
        }
        .hidden { transform: translateY(-100%); }
    </style>
</head>
<body data-theme="dark">
    <div id="conn-msg">LINK OFFLINE - TAP TO ESTABLISH NEURAL LINK</div>

    <div class="dashboard">
        <div class="hdr">
            <h2 style="font-weight: 300;">ROBO<span style="font-weight: 700; color: var(--primary);">ROVER</span></h2>
            <div class="theme-toggle" id="theme-btn"></div>
        </div>

        <div class="stats">
            <div class="stat-card">
                <div class="stat-label">Mission</div>
                <div class="stat-val" id="mode-text">IDLE</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Scanner</div>
                <div class="stat-val" id="dist-text">--</div>
            </div>
        </div>

        <div class="ctrl-area">
            <div id="joy-outer">
                <div id="joy-knob"></div>
            </div>
            <p style="margin-top: 20px; font-size: 0.6rem; color: var(--subtext); text-transform: uppercase;">Directional Vector Control</p>
        </div>

        <div class="btn-group">
            <button class="m-btn active" id="btn-manual" onclick="send('M')">MANUAL</button>
            <button class="m-btn" id="btn-auto" onclick="send('A')">AI AUTO</button>
        </div>

        <button class="stop-btn" onclick="send('S')">HALT ROBOT</button>
    </div>

    <script>
        const SERVICE_UUID = "4fafc201-1fb5-459e-8fcc-c5c9c331914b";
        const CHAR_UUID = "beb5483e-36e1-4688-b7f5-ea07361b26a8";
        let device, char, lastCmd = 'S';

        // Theme Switcher
        const themeBtn = document.getElementById('theme-btn');
        themeBtn.onclick = () => {
            const current = document.body.getAttribute('data-theme');
            document.body.setAttribute('data-theme', current === 'dark' ? 'light' : 'dark');
        };

        // BLE Core
        async function connect() {
            try {
                device = await navigator.bluetooth.requestDevice({
                    filters: [{ name: 'ROBOROVER_BLE' }],
                    optionalServices: [SERVICE_UUID]
                });
                const server = await device.gatt.connect();
                const service = await server.getPrimaryService(SERVICE_UUID);
                char = await service.getCharacteristic(CHAR_UUID);
                document.getElementById('conn-msg').classList.add('hidden');
                char.startNotifications();
                char.addEventListener('characteristicvaluechanged', (e) => {
                    const [mode, dist] = new TextDecoder().decode(e.target.value).split(',');
                    document.getElementById('mode-text').innerText = mode == 'M' ? "MANUAL" : "AUTO";
                    document.getElementById('dist-text').innerText = dist + "cm";
                });
            } catch (e) { alert("Link Failed: " + e.message); }
        }
        document.getElementById('conn-msg').onclick = connect;

        // Joystick Logic
        const outer = document.getElementById('joy-outer');
        const knob = document.getElementById('joy-knob');
        let isMoving = false;

        const start = (e) => { isMoving = true; handleMove(e); }
        const end = () => { 
            isMoving = false; 
            knob.style.transform = `translate(0,0)`;
            send('S');
        }

        const handleMove = (e) => {
            if(!isMoving) return;
            const touch = e.touches ? e.touches[0] : e;
            const rect = outer.getBoundingClientRect();
            const cx = rect.left + rect.width / 2;
            const cy = rect.top + rect.height / 2;
            let x = touch.clientX - cx;
            let y = touch.clientY - cy;

            const limit = rect.width / 2 - 40;
            const dist = Math.min(Math.sqrt(x*x + y*y), limit);
            const angle = Math.atan2(y, x);
            
            x = Math.cos(angle) * dist;
            y = Math.sin(angle) * dist;
            knob.style.transform = `translate(${x}px, ${y}px)`;

            let cmd = 'S';
            if (dist > limit * 0.4) {
                const deg = angle * 180 / Math.PI;
                if (deg > -135 && deg < -45) cmd = 'F';
                else if (deg > 45 && deg < 135) cmd = 'B';
                else if (deg >= -45 && deg <= 45) cmd = 'R';
                else cmd = 'L';
            }
            if(cmd !== lastCmd) { lastCmd = cmd; send(cmd); }
        }

        outer.addEventListener('touchstart', start);
        window.addEventListener('touchmove', handleMove);
        window.addEventListener('touchend', end);

        async function send(cmd) {
            if(!char) return;
            try {
                await char.writeValue(new TextEncoder().encode(cmd));
                if(cmd === 'A') { document.getElementById('btn-auto').classList.add('active'); document.getElementById('btn-manual').classList.remove('active'); }
                if(cmd === 'M') { document.getElementById('btn-manual').classList.add('active'); document.getElementById('btn-auto').classList.remove('active'); }
            } catch(e) {}
        }
    </script>
</body>
</html>
