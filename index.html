<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ROBOROVER PRO | Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00d2ff; --accent: #ff0055; --bg: #0b111a;
            --card: rgba(255, 255, 255, 0.05); --text: #fff; --sub: #8892b0;
        }
        [data-theme="light"] {
            --primary: #0070f3; --bg: #f0f2f5; --card: rgba(255, 255, 255, 0.9); --text: #1a202c; --sub: #4a5568;
        }
        * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color: transparent; font-family: 'Outfit', sans-serif; }
        body { background: var(--bg); color: var(--text); height: 100vh; display: flex; align-items: center; justify-content: center; transition: background 0.4s ease; overflow: hidden; }
        
        .dashboard { width: 92%; max-width: 420px; padding: 30px; border-radius: 45px; background: var(--card); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 40px 100px rgba(0,0,0,0.5); position: relative; }
        .hdr { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; }
        .logo { font-size: 1.5rem; letter-spacing: 2px; }
        
        .stats { display: flex; gap: 15px; margin-bottom: 25px; }
        .stat-card { flex: 1; padding: 20px; background: rgba(0,0,0,0.1); border-radius: 25px; text-align: center; border: 1px solid rgba(255,255,255,0.05); }
        .stat-val { font-size: 1.4rem; font-weight: 800; color: var(--primary); }
        .stat-lbl { font-size: 0.65rem; text-transform: uppercase; color: var(--sub); letter-spacing: 1.5px; margin-top: 5px; }

        /* THE D-PAD */
        .dpad { display: grid; grid-template-areas: ". up ." "left . right" ". down ."; gap: 15px; justify-content: center; margin: 35px 0; }
        .d-btn { width: 85px; height: 85px; background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); border-radius: 24px; color: var(--text); font-size: 1.8rem; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.2s; box-shadow: 0 10px 0 rgba(0,0,0,0.2); }
        .d-btn:active { background: var(--primary); color: #000; box-shadow: 0 0 35px var(--primary); transform: translateY(5px); }
        .d-btn.disabled { opacity: 0.2; pointer-events: none; }

        .btn-group { display: flex; gap: 12px; }
        .m-btn { flex: 1; padding: 20px; border-radius: 22px; border: none; background: rgba(0,0,0,0.3); color: var(--sub); font-weight: 800; font-size: 0.85rem; cursor: pointer; transition: 0.3s; letter-spacing: 1.5px; }
        .m-btn.active { background: var(--primary); color: #000; box-shadow: 0 15px 35px rgba(0, 210, 255, 0.4); }

        .halt { width: 100%; padding: 24px; border-radius: 28px; border: none; background: var(--accent); color: #fff; font-weight: 800; font-size: 1.2rem; margin-top: 25px; cursor: pointer; box-shadow: 0 15px 45px rgba(255,0,85,0.4); letter-spacing: 2px; }
        .halt:active { transform: scale(0.96); }
        
        #conn-msg { position: fixed; top: 0; left: 0; width: 100%; padding: 15px; background: var(--primary); color: #000; text-align: center; font-weight: 800; cursor: pointer; z-index: 100; transition: 0.5s; box-shadow: 0 5px 15px rgba(0,0,0,0.2); }
        .hidden { transform: translateY(-100%); }
    </style>
</head>
<body data-theme="dark">
    <div id="conn-msg">NEURAL LINK REQUIRED - TAP TO CONNECT</div>

    <div class="dashboard">
        <div class="hdr">
            <h2 class="logo">ROBO<span style="color:var(--primary)">ROVER</span></h2>
            <div onclick="document.body.dataset.theme = (document.body.dataset.theme === 'light' ? 'dark' : 'light')" style="cursor:pointer; font-size: 1.4rem;">🌓</div>
        </div>

        <div class="stats">
            <div class="stat-card"><div class="stat-val" id="m-txt">--</div><div class="stat-lbl">Mode</div></div>
            <div class="stat-card"><div class="stat-val" id="d-txt">--</div><div class="stat-lbl">Distance</div></div>
        </div>

        <div class="dpad" id="main-pad">
            <button class="d-btn" style="grid-area: up" id="up">▲</button>
            <button class="d-btn" style="grid-area: left" id="left">◀</button>
            <button class="d-btn" style="grid-area: right" id="right">▶</button>
            <button class="d-btn" style="grid-area: down" id="down">▼</button>
        </div>

        <div class="btn-group">
            <button class="m-btn active" id="mode-m" onclick="send('M')">MANUAL</button>
            <button class="m-btn" id="mode-a" onclick="send('A')">AI AUTO</button>
        </div>

        <button class="halt" onclick="send('S')">IMMEDIATE HALT</button>
    </div>

    <script>
        const SERVICE_UUID = "4fafc201-1fb5-459e-8fcc-c5c9c331914b";
        const CHAR_UUID = "beb5483e-36e1-4688-b7f5-ea07361b26a8";
        let char, curMode = 'M';

        async function connect() {
            try {
                const device = await navigator.bluetooth.requestDevice({ filters: [{ name: 'ROBOROVER_BLE' }], optionalServices: [SERVICE_UUID] });
                const server = await device.gatt.connect();
                const service = await server.getPrimaryService(SERVICE_UUID);
                char = await service.getCharacteristic(CHAR_UUID);
                document.getElementById('conn-msg').classList.add('hidden');
                char.startNotifications();
                char.addEventListener('characteristicvaluechanged', (e) => {
                    const data = new TextDecoder().decode(e.target.value);
                    const [mode, dist] = data.split(',');
                    curMode = mode;
                    document.getElementById('m-txt').innerText = mode === 'M' ? "MANUAL" : "AUTO";
                    document.getElementById('d-txt').innerText = dist + "cm";
                    document.getElementById('mode-a').classList.toggle('active', mode === 'A');
                    document.getElementById('mode-m').classList.toggle('active', mode === 'M');
                    document.getElementById('main-pad').classList.toggle('disabled', mode === 'A');
                });
            } catch (e) { alert("Link Interrupted: " + e); }
        }
        document.getElementById('conn-msg').onclick = connect;

        const bind = (id, cmd) => {
            const el = document.getElementById(id);
            const press = (e) => { e.preventDefault(); if(curMode === 'M') send(cmd); };
            const release = (e) => { e.preventDefault(); if(curMode === 'M') send('S'); };
            el.addEventListener('mousedown', press); el.addEventListener('mouseup', release);
            el.addEventListener('touchstart', press); el.addEventListener('touchend', release);
        };
        bind('up', 'F'); bind('down', 'B'); bind('left', 'L'); bind('right', 'R');

        async function send(c) {
            if(!char) return;
            try { await char.writeValue(new TextEncoder().encode(c)); } catch(e) {}
        }
    </script>
</body>
</html>
