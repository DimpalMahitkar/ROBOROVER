<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ROBOROVER PRO | Command Center</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00d2ff; --accent: #ff0055; --bg: #0b0e14;
            --card: rgba(255, 255, 255, 0.05); --text: #fff; --sub: #888;
        }
        [data-theme="light"] {
            --primary: #00a8cc; --bg: #f8fafc; --card: rgba(255, 255, 255, 0.9); --text: #1e293b; --sub: #64748b;
        }
        * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color: transparent; font-family: 'Outfit', sans-serif; }
        body { background: var(--bg); color: var(--text); height: 100vh; display: flex; align-items: center; justify-content: center; transition: 0.3s; }
        
        .dashboard { width: 90%; max-width: 400px; padding: 25px; border-radius: 40px; background: var(--card); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 40px 100px rgba(0,0,0,0.3); }
        .hdr { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        
        .stats { display: flex; gap: 10px; margin-bottom: 20px; }
        .stat-card { flex: 1; padding: 15px; background: rgba(0,0,0,0.1); border-radius: 20px; text-align: center; border: 1px solid rgba(255,255,255,0.05); }
        .stat-val { font-size: 1.2rem; font-weight: 800; color: var(--primary); }
        .stat-lbl { font-size: 0.6rem; text-transform: uppercase; color: var(--sub); letter-spacing: 1px; }

        /* D-PAD DESIGN */
        .dpad { display: grid; grid-template-areas: ". up ." "left . right" ". down ."; gap: 15px; justify-content: center; margin: 30px 0; }
        .d-btn { width: 80px; height: 80px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; color: var(--text); font-size: 1.5rem; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.15s; }
        .d-btn:active { background: var(--primary); color: #000; box-shadow: 0 0 30px var(--primary); transform: scale(0.95); }

        .btn-group { display: flex; gap: 10px; margin-top: 10px; }
        .m-btn { flex: 1; padding: 18px; border-radius: 20px; border: none; background: rgba(0,0,0,0.2); color: var(--sub); font-weight: 800; font-size: 0.8rem; cursor: pointer; transition: 0.3s; letter-spacing: 1px; }
        .m-btn.active { background: var(--primary); color: #000; box-shadow: 0 10px 30px rgba(0, 210, 255, 0.3); }

        .halt { width: 100%; padding: 22px; border-radius: 25px; border: none; background: var(--accent); color: #fff; font-weight: 800; font-size: 1.1rem; margin-top: 20px; cursor: pointer; box-shadow: 0 10px 40px rgba(255,0,85,0.3); }
        
        #conn-msg { position: fixed; top: 0; left: 0; width: 100%; padding: 12px; background: var(--primary); color: #000; text-align: center; font-weight: 800; cursor: pointer; z-index: 100; }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div id="conn-msg">TAP TO LINK ROBOROVER</div>

    <div class="dashboard">
        <div class="hdr">
            <h2>ROBO<span style="color:var(--primary)">ROVER</span></h2>
            <div onclick="document.body.dataset.theme = (document.body.dataset.theme === 'light' ? 'dark' : 'light')" style="cursor:pointer">🌓</div>
        </div>

        <div class="stats">
            <div class="stat-card"><div class="stat-val" id="m-txt">----</div><div class="stat-lbl">Mode</div></div>
            <div class="stat-card"><div class="stat-val" id="d-txt">--</div><div class="stat-lbl">Distance</div></div>
        </div>

        <div class="dpad">
            <button class="d-btn" style="grid-area: up" id="f">▲</button>
            <button class="d-btn" style="grid-area: left" id="l">◀</button>
            <button class="d-btn" style="grid-area: right" id="r">▶</button>
            <button class="d-btn" style="grid-area: down" id="b">▼</button>
        </div>

        <div class="btn-group">
            <button class="m-btn active" id="mode-m" onclick="send('M')">MANUAL</button>
            <button class="m-btn" id="mode-a" onclick="send('A')">AI AUTO</button>
        </div>

        <button class="halt" onclick="send('S')">IMMEDIATE HALT</button>
    </div>

    <script>
        const SERVICE_UUID = "4fafc201-1fb5-459e-8fcc-c5c9c331914b";
        const CHAR_UUID = "beb5483e-36e1-4688-b7f5-ea07361b26a8";
        let char;

        async function connect() {
            try {
                const device = await navigator.bluetooth.requestDevice({ filters: [{ name: 'ROBOROVER_BLE' }], optionalServices: [SERVICE_UUID] });
                const server = await device.gatt.connect();
                const service = await server.getPrimaryService(SERVICE_UUID);
                char = await service.getCharacteristic(CHAR_UUID);
                document.getElementById('conn-msg').classList.add('hidden');
                char.startNotifications();
                char.addEventListener('characteristicvaluechanged', (e) => {
                    const data = new TextDecoder().decode(e.target.value);
                    if(data.startsWith("MSG:")) return;
                    const [mode, dist] = data.split(',');
                    document.getElementById('m-txt').innerText = mode === 'M' ? "MANUAL" : "AUTO";
                    document.getElementById('d-txt').innerText = dist + "cm";
                    document.getElementById('mode-a').classList.toggle('active', mode === 'A');
                    document.getElementById('mode-m').classList.toggle('active', mode === 'M');
                });
            } catch (e) { alert("BLE Link: " + e); }
        }
        document.getElementById('conn-msg').onclick = connect;

        const bind = (id, cmd) => {
            const el = document.getElementById(id);
            const start = (e) => { e.preventDefault(); send(cmd); };
            const end = (e) => { e.preventDefault(); send('S'); };
            el.addEventListener('mousedown', start); el.addEventListener('mouseup', end);
            el.addEventListener('touchstart', start); el.addEventListener('touchend', end);
        };
        bind('f', 'F'); bind('b', 'B'); bind('l', 'L'); bind('r', 'R');

        async function send(c) {
            if(!char) return;
            try { await char.writeValue(new TextEncoder().encode(c)); } catch(e) {}
        }
    </script>
</body>
</html>
