<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ROBOROVER | Premium Controller</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00d2ff;
            --accent: #ff0055;
            --bg: #0b0e14;
            --card: rgba(255, 255, 255, 0.05);
            --text: #ffffff;
            --subtext: #888;
            --shadow: rgba(0, 210, 255, 0.2);
            --font: 'Outfit', sans-serif;
        }

        [data-theme="light"] {
            --primary: #00a8cc;
            --bg: #f0f4f8;
            --card: rgba(255, 255, 255, 0.7);
            --text: #1a202c;
            --subtext: #4a5568;
            --shadow: rgba(0, 168, 204, 0.1);
        }

        * { margin:0; padding:0; box-sizing:border-box; touch-action:none; -webkit-tap-highlight-color: transparent; }
        body { 
            font-family: var(--font); background: var(--bg); color: var(--text); 
            height: 100vh; display: flex; align-items: center; justify-content: center;
            transition: background 0.5s ease;
        }

        .dashboard {
            width: 90%; max-width: 450px; padding: 25px; border-radius: 40px;
            background: var(--card); backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 60px rgba(0,0,0,0.2);
            display: flex; flex-direction: column; gap: 20px;
        }

        .hdr { display: flex; justify-content: space-between; align-items: center; }
        .theme-toggle {
            width: 44px; height: 24px; background: rgba(0,0,0,0.2); border-radius: 12px;
            position: relative; cursor: pointer; border: 1px solid rgba(255,255,255,0.1);
        }
        .theme-toggle::after {
            content: ""; position: absolute; left: 2px; top: 2px;
            width: 20px; height: 20px; background: #fff; border-radius: 50%;
            transition: 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }
        [data-theme="light"] .theme-toggle::after { transform: translateX(20px); }

        .stats { display: flex; gap: 15px; }
        .stat-card {
            flex: 1; padding: 18px; background: rgba(0,0,0,0.08); border-radius: 25px;
            text-align: center; border: 1px solid rgba(255,255,255,0.05);
        }
        .stat-label { font-size: 0.65rem; text-transform: uppercase; letter-spacing: 1.5px; color: var(--subtext); }
        .stat-val { font-size: 1.4rem; font-weight: 700; color: var(--primary); margin-top: 4px; }

        .ctrl-area { height: 280px; display: flex; align-items: center; justify-content: center; position: relative; }
        #joy-outer {
            width: 200px; height: 200px; border-radius: 50%;
            background: radial-gradient(circle, rgba(255,255,255,0.03) 0%, rgba(0,0,0,0.1) 100%);
            border: 2px solid rgba(255,255,255,0.05);
            position: relative; display: flex; align-items: center; justify-content: center;
        }
        #joy-knob {
            width: 80px; height: 80px; background: linear-gradient(135deg, var(--primary), #00ffcc);
            border-radius: 50%; box-shadow: 0 10px 30px var(--shadow);
            position: absolute; transition: transform 0.05s linear;
        }
        .disabled { opacity: 0.3; pointer-events: none; }

        .btn-group { display: flex; gap: 10px; }
        .m-btn {
            flex: 1; padding: 16px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.1);
            background: rgba(0,0,0,0.2); color: var(--subtext);
            font-weight: 700; font-size: 0.75rem; cursor: pointer; transition: 0.3s;
        }
        .m-btn.active { background: var(--primary); color: #000; border-color: var(--primary); box-shadow: 0 0 20px var(--shadow); }

        .stop-btn {
            width: 100%; padding: 22px; border-radius: 25px; border: none;
            background: var(--accent); color: #fff; font-size: 1.1rem; font-weight: 700;
            letter-spacing: 1px; cursor: pointer; transition: 0.2s;
        }
        .stop-btn:active { transform: scale(0.95); opacity: 0.8; }

        #conn-msg {
            position: fixed; top: 0; left: 0; width: 100%; padding: 12px;
            background: var(--primary); color: #fff; text-align: center; font-weight: 700;
            cursor: pointer; z-index: 1000; transition: 0.4s;
        }
        .hidden { transform: translateY(-100%); }
    </style>
</head>
<body data-theme="dark">
    <div id="conn-msg">CLICK TO ESTABLISH LINK</div>

    <div class="dashboard">
        <div class="hdr">
            <h2 style="font-weight: 300;">ROBO<span style="font-weight: 700; color: var(--primary);">ROVER</span></h2>
            <div class="theme-toggle" id="theme-btn"></div>
        </div>

        <div class="stats">
            <div class="stat-card">
                <div class="stat-label">System Mode</div>
                <div class="stat-val" id="mode-text">IDLE</div>
            </div>
            <div class="stat-card">
                <div class="stat-label">Obstacle</div>
                <div class="stat-val" id="dist-text">--</div>
            </div>
        </div>

        <div class="ctrl-area" id="ctrl-shield">
            <div id="joy-outer">
                <div id="joy-knob"></div>
            </div>
        </div>

        <div class="btn-group">
            <button class="m-btn active" id="btn-manual" onclick="send('M')">MANUAL</button>
            <button class="m-btn" id="btn-auto" onclick="send('A')">AI AUTO</button>
        </div>

        <button class="stop-btn" onclick="send('S')">HALT ROBOT</button>
    </div>

    <script>
        const SERVICE_UUID = "4fafc201-1fb5-459e-8fcc-c5c9c331914b";
        const CHAR_UUID = "beb5483e-36e1-4688-b7f5-ea07361b26a8";
        let device, char, currentMode = 'M', lastCmd = 'S';

        // Theme Toggle
        document.getElementById('theme-btn').onclick = () => {
            const current = document.body.getAttribute('data-theme');
            document.body.setAttribute('data-theme', current === 'dark' ? 'light' : 'dark');
        };

        // BLE Core
        async function connect() {
            try {
                device = await navigator.bluetooth.requestDevice({
                    filters: [{ name: 'ROBOROVER_BLE' }],
                    optionalServices: [SERVICE_UUID]
                });
                const server = await device.gatt.connect();
                const service = await server.getPrimaryService(SERVICE_UUID);
                char = await service.getCharacteristic(CHAR_UUID);
                document.getElementById('conn-msg').classList.add('hidden');
                char.startNotifications();
                char.addEventListener('characteristicvaluechanged', (e) => {
                    const data = new TextDecoder().decode(e.target.value);
                    if (data.startsWith("MSG:")) {
                        document.getElementById('mode-text').innerText = data.replace("MSG:", "");
                    } else {
                        const [mode, dist] = data.split(',');
                        syncMode(mode);
                        document.getElementById('dist-text').innerText = dist + "cm";
                    }
                });
            } catch (e) { alert("BLE Link: " + e.message); }
        }
        document.getElementById('conn-msg').onclick = connect;

        function syncMode(m) {
            currentMode = m;
            const isAuto = m === 'A';
            document.getElementById('btn-auto').classList.toggle('active', isAuto);
            document.getElementById('btn-manual').classList.toggle('active', !isAuto);
            document.getElementById('ctrl-shield').classList.toggle('disabled', isAuto);
            document.getElementById('mode-text').innerText = isAuto ? "AUTONOMOUS" : "MANUAL";
        }

        // Joystick
        const outer = document.getElementById('joy-outer');
        const knob = document.getElementById('joy-knob');
        let moveActive = false;

        const handleStart = (e) => { if(currentMode === 'A') return; moveActive = true; handleMove(e); }
        const handleEnd = () => { 
            if(!moveActive) return;
            moveActive = false; 
            knob.style.transform = `translate(0,0)`;
            send('S');
        }

        const handleMove = (e) => {
            if(!moveActive || currentMode === 'A') return;
            const touch = e.touches ? e.touches[0] : e;
            const rect = outer.getBoundingClientRect();
            const cx = rect.left + rect.width / 2;
            const cy = rect.top + rect.height / 2;
            const x = touch.clientX - cx;
            const y = touch.clientY - cy;

            const limit = rect.width / 2 - 40;
            const dist = Math.min(Math.sqrt(x*x + y*y), limit);
            const angle = Math.atan2(y, x);
            
            knob.style.transform = `translate(${Math.cos(angle)*dist}px, ${Math.sin(angle)*dist}px)`;

            let cmd = 'S';
            if (dist > limit * 0.4) {
                const deg = angle * 180 / Math.PI;
                if (deg > -135 && deg < -45) cmd = 'F';
                else if (deg > 45 && deg < 135) cmd = 'B';
                else if (deg >= -45 && deg <= 45) cmd = 'R';
                else cmd = 'L';
            }
            if(cmd !== lastCmd) { lastCmd = cmd; send(cmd); }
        }

        outer.addEventListener('touchstart', handleStart);
        window.addEventListener('touchmove', handleMove);
        window.addEventListener('touchend', handleEnd);

        async function send(cmd) {
            if(!char) return;
            try {
                await char.writeValue(new TextEncoder().encode(cmd));
            } catch(e) {}
        }
    </script>
</body>
</html>
