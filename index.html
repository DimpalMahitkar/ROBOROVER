<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ROBOROVER | AI Center</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;800&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #00d2ff; --accent: #ff0055; --bg: #0b111a; --card: rgba(255, 255, 255, 0.04); --text: #ffffff; }
        * { margin:0; padding:0; box-sizing:border-box; font-family: 'Outfit', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: var(--text); display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
        .dashboard { width: 100%; max-width: 450px; background: var(--card); backdrop-filter: blur(20px); border-radius: 40px; padding: 30px; border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 40px 100px rgba(0,0,0,0.5); }
        .hdr { text-align: center; margin-bottom: 25px; }
        .hdr b { color: var(--primary); }
        .stats { display: flex; gap: 15px; margin-bottom: 20px; }
        .stat-card { flex: 1; padding: 15px; background: rgba(0,0,0,0.2); border-radius: 20px; text-align: center; border: 1px solid rgba(255,255,255,0.05); }
        .stat-val { font-size: 1.4rem; font-weight: 800; color: var(--primary); }
        .stat-lbl { font-size: 0.7rem; text-transform: uppercase; opacity: 0.6; letter-spacing: 1px; }
        .console { background: rgba(0,210,255,0.05); padding: 12px; border-radius: 15px; text-align: center; font-family: monospace; font-size: 0.8rem; color: var(--primary); margin-bottom: 20px; border: 1px solid rgba(0,210,255,0.2); height: 45px; }
        .dpad { display: grid; grid-template-areas: ". up ." "left . right" ". down ."; gap: 15px; justify-content: center; margin-bottom: 25px; }
        .d-btn { width: 75px; height: 75px; background: rgba(255,255,255,0.05); border: none; border-radius: 20px; color: #fff; font-size: 1.5rem; cursor: pointer; transition: 0.2s; }
        .d-btn:active { background: var(--primary); color: #000; transform: scale(0.9); }
        .disabled { opacity: 0.1; pointer-events: none; }
        .btn-row { display: flex; gap: 10px; margin-bottom: 10px; }
        .btn { flex: 1; padding: 18px; border-radius: 18px; border: none; font-weight: 800; cursor: pointer; transition: 0.3s; text-transform: uppercase; }
        .btn-m { background: rgba(255,255,255,0.1); color: #fff; }
        .btn-m.active { background: var(--primary); color: #000; }
        .btn-l { background: #00ffaa; color: #000; width: 100%; }
        .btn-halt { background: var(--accent); color: #fff; font-size: 1.2rem; width: 100%; margin-top: 10px; }
        #conn-btn { position: fixed; top: 0; left: 0; width: 100%; padding: 12px; background: var(--primary); color: #000; text-align: center; font-weight: 800; cursor: pointer; z-index: 100; }
    </style>
</head>
<body>
    <div id="conn-btn" onclick="connect()">CONNECT TO ROBOROVER</div>
    <div class="dashboard">
        <div class="hdr"><h2>ROBO<b>ROVER</b> AI</h2></div>
        <div class="stats">
            <div class="stat-card"><div class="stat-val" id="st-mode">--</div><div class="stat-lbl">Control</div></div>
            <div class="stat-card"><div class="stat-val" id="st-dist">--</div><div class="stat-lbl">Radar</div></div>
        </div>
        <div class="console" id="console">> AWAITING LINK...</div>
        <div class="dpad" id="dpad">
            <button class="d-btn" style="grid-area: up" id="f">▲</button>
            <button class="d-btn" style="grid-area: left" id="l">◀</button>
            <button class="d-btn" style="grid-area: right" id="r">▶</button>
            <button class="d-btn" style="grid-area: down" id="b">▼</button>
        </div>
        <div class="btn-row">
            <button class="btn btn-m active" id="m-btn" onclick="send('M')">Manual</button>
            <button class="btn btn-m" id="a-btn" onclick="send('A')">AI Auto</button>
        </div>
        <button class="btn btn-l" onclick="send('LN')">Reset & Start Learning</button>
        <button class="btn btn-halt" id="halt-btn">HALT SYSTEM</button>
    </div>
    <script>
        const UUID_SVC = "4fafc201-1fb5-459e-8fcc-c5c9c331914b";
        const UUID_CHR = "beb5483e-36e1-4688-b7f5-ea07361b26a8";
        let charDirect, currentMode = 'M';
        let isWriting = false, msgQueue = [];
        let wakeLock = null;

        async function requestWakeLock() {
            try { wakeLock = await navigator.wakeLock.request('screen'); } 
            catch (err) { console.error(err); }
        }

        document.addEventListener('visibilitychange', () => {
            if (wakeLock !== null && document.visibilityState === 'visible') requestWakeLock();
        });

        async function connect() {
            try {
                const device = await navigator.bluetooth.requestDevice({ filters: [{ name: 'ROBOROVER_BLE' }], optionalServices: [UUID_SVC] });
                const server = await device.gatt.connect();
                const service = await server.getPrimaryService(UUID_SVC);
                charDirect = await service.getCharacteristic(UUID_CHR);
                document.getElementById('conn-btn').style.display = 'none';
                
                await requestWakeLock();

                charDirect.startNotifications();
                charDirect.addEventListener('characteristicvaluechanged', e => {
                    const val = new TextDecoder().decode(e.target.value);
                    if(val.startsWith("MSG:")) { document.getElementById('console').innerText = "> " + val.substring(4); }
                    else {
                        const [m, d, ai] = val.split(',');
                        currentMode = m;
                        document.getElementById('st-mode').innerText = m === 'M' ? "MANUAL" : (ai === "REC" ? "RECORDING" : "PREDICT");
                        document.getElementById('st-dist').innerText = d + "cm";
                        document.getElementById('dpad').classList.toggle('disabled', m === 'A');
                        document.getElementById('a-btn').classList.toggle('active', m === 'A');
                        document.getElementById('m-btn').classList.toggle('active', m === 'M');
                    }
                });
            } catch (e) { console.log(e); }
        }

        async function send(msg) {
            if(!charDirect) return;
            msgQueue.push(msg); 
            if(isWriting) return;
            isWriting = true;
            while(msgQueue.length > 0) {
                let toSend = msgQueue.shift();
                try { await charDirect.writeValue(new TextEncoder().encode(toSend)); } catch(exc) {}
            }
            isWriting = false;
        }

        const bind = (id, cmd) => {
            const el = document.getElementById(id);
            el.onpointerdown = (e) => { e.preventDefault(); if(currentMode === 'M') send(cmd); };
            el.onpointerup = (e) => { e.preventDefault(); if(currentMode === 'M') send('S'); };
            el.onpointerleave = (e) => { e.preventDefault(); if(currentMode === 'M') send('S'); };
        };
        bind('f', 'F'); bind('b', 'B'); bind('l', 'L'); bind('r', 'R');

        document.getElementById('halt-btn').onpointerdown = (e) => {
            e.preventDefault();
            send('S');
            currentMode = 'M';
            document.getElementById('st-mode').innerText = "MANUAL";
            document.getElementById('dpad').classList.remove('disabled');
            document.getElementById('a-btn').classList.remove('active');
            document.getElementById('m-btn').classList.add('active');
        };
    </script>
</body>
</html>
