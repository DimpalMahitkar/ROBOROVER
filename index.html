<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ROBOROVER | Universal Command Center</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00d2ff; --accent: #ff0055; --bg: #0b111a;
            --card: rgba(255, 255, 255, 0.04); --text: #ffffff; --sub: #8892b0;
            --btn-size: clamp(65px, 15vmin, 100px);
            --font-lg: clamp(1.2rem, 3.5vmin, 1.8rem);
            --font-sm: clamp(0.7rem, 2vmin, 0.9rem);
        }
        [data-theme="light"] {
            --primary: #0060df; --bg: #f8fafc; --card: rgba(255, 255, 255, 0.85); --text: #0f172a; --sub: #64748b;
        }

        * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color: transparent; font-family: 'Outfit', sans-serif; }
        
        body { 
            background: var(--bg); color: var(--text); 
            min-height: 100vh; display: flex; align-items: center; justify-content: center; 
            transition: 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            overflow-x: hidden; padding: 20px;
        }

        .dashboard { 
            width: 100%; max-width: 500px; 
            padding: clamp(20px, 5vw, 40px); 
            border-radius: clamp(30px, 8vw, 60px); 
            background: var(--card); backdrop-filter: blur(30px); 
            border: 1px solid rgba(255,255,255,0.08); 
            box-shadow: 0 50px 120px rgba(0,0,0,0.6);
            display: flex; flex-direction: column; 
        }

        .hdr { display: flex; justify-content: space-between; align-items: center; margin-bottom: 5vh; }
        .logo { font-size: var(--font-lg); letter-spacing: 2px; text-transform: uppercase; font-weight: 300; }
        .logo b { font-weight: 800; color: var(--primary); }

        .stats { display: flex; gap: 4%; margin-bottom: 4vh; }
        .stat-card { 
            flex: 1; padding: clamp(12px, 3vh, 25px); 
            background: rgba(0,0,0,0.15); border-radius: clamp(15px, 4vw, 25px); 
            border: 1px solid rgba(255,255,255,0.05);
        }
        .stat-val { font-size: var(--font-lg); font-weight: 800; color: var(--primary); }
        .stat-lbl { font-size: var(--font-sm); text-transform: uppercase; color: var(--sub); letter-spacing: 1.5px; opacity: 0.8; }

        /* THE ADAPTIVE D-PAD */
        .dpad { 
            display: grid; grid-template-areas: ". up ." "left . right" ". down ."; 
            gap: 15px; justify-content: center; margin-bottom: 5vh;
        }
        .d-btn { 
            width: var(--btn-size); height: var(--btn-size); 
            background: rgba(255,255,255,0.02); 
            border: 2px solid rgba(255,255,255,0.05); 
            border-radius: clamp(15px, 4vw, 30px); 
            color: var(--text); font-size: 1.8rem; cursor: pointer; 
            display: flex; align-items: center; justify-content: center; 
            transition: 0.15s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
            box-shadow: 0 8px 0 rgba(0,0,0,0.2);
        }
        .d-btn:active { background: var(--primary); color: #000; box-shadow: 0 0 40px var(--primary); transform: translateY(4px); border-color: transparent; }
        .d-btn.disabled { opacity: 0.1; filter: grayscale(1); pointer-events: none; }

        .btn-group { display: flex; gap: 12px; margin-top: auto; }
        .m-btn { 
            flex: 1; padding: clamp(15px, 2.5vh, 25px); 
            border-radius: clamp(15px, 4vw, 25px); 
            border: none; background: rgba(0,0,0,0.3); color: var(--sub); 
            font-weight: 800; font-size: var(--font-sm); 
            cursor: pointer; transition: 0.3s; letter-spacing: 1.5px;
        }
        .m-btn.active { background: var(--primary); color: #000; box-shadow: 0 10px 40px rgba(0, 210, 255, 0.35); }

        .halt { 
            width: 100%; padding: clamp(18px, 3vh, 30px); 
            border-radius: clamp(20px, 5vw, 30px); 
            border: none; background: var(--accent); color: #fff; 
            font-weight: 800; font-size: var(--font-lg); 
            margin-top: 25px; cursor: pointer; 
            box-shadow: 0 20px 50px rgba(255,0,85,0.4); letter-spacing: 2px;
        }
        .halt:active { transform: scale(0.97) translateY(2px); opacity: 0.9; }
        
        #conn-msg { 
            position: fixed; top: 0; left:0; width: 100%; padding: 15px; 
            background: var(--primary); color: #000; text-align: center; 
            font-weight: 800; cursor: pointer; z-index: 1000; 
            transition: transform 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55); 
        }
        .hidden { transform: translateY(-100%); }

        /* Tablet/Desktop Tweaks */
        @media (min-width: 768px) { .dashboard { max-width: 550px; } }
    </style>
</head>
<body data-theme="dark">
    <div id="conn-msg">SYSTEM LINK PENDING - TAP TO ACTIVATE</div>

    <div class="dashboard">
        <div class="hdr">
            <h2 class="logo">ROBO<b>ROVER</b></h2>
            <div onclick="document.body.dataset.theme = (document.body.dataset.theme === 'light' ? 'dark' : 'light')" style="cursor:pointer; font-size: 1.5rem;">🌓</div>
        </div>

        <div class="stats">
            <div class="stat-card">
                <div class="stat-val" id="m-txt">--</div>
                <div class="stat-lbl">Control</div>
            </div>
            <div class="stat-card">
                <div class="stat-val" id="d-txt">--</div>
                <div class="stat-lbl">Radar</div>
            </div>
        </div>

        <div class="log-container" style="margin-bottom: 3vh; padding: 15px; border-radius: clamp(15px, 4vw, 25px); background: rgba(0,210,255,0.05); border: 1px solid rgba(0,210,255,0.15); text-align: center;">
            <div style="font-size: var(--font-sm); text-transform: uppercase; color: var(--sub); letter-spacing: 1.5px; opacity: 0.8; margin-bottom: 5px;">System Console</div>
            <div id="log-box" style="font-size: var(--font-sm); font-weight: 600; color: var(--primary); font-family: monospace; letter-spacing: 1px;">AWAITING LINK...</div>
        </div>

        <div class="dpad" id="main-pad">
            <button class="d-btn" style="grid-area: up" id="up">▲</button>
            <button class="d-btn" style="grid-area: left" id="left">◀</button>
            <button class="d-btn" style="grid-area: right" id="right">▶</button>
            <button class="d-btn" style="grid-area: down" id="down">▼</button>
        </div>

        <div class="btn-group">
            <button class="m-btn active" id="mode-m" onclick="send('M')">MANUAL</button>
            <button class="m-btn" id="mode-a" onclick="send('A')">AI AUTO</button>
        </div>

        <button class="halt" onclick="send('S'); currentM='M';">HALT SYSTEM</button>
    </div>

    <script>
        const SERVICE_UUID = "4fafc201-1fb5-459e-8fcc-c5c9c331914b";
        const CHAR_UUID = "beb5483e-36e1-4688-b7f5-ea07361b26a8";
        let charDirect, currentM = 'M';
        let bleDevice = null;

        async function connect() {
            try {
                if (!bleDevice) {
                    bleDevice = await navigator.bluetooth.requestDevice({ filters: [{ name: 'ROBOROVER_BLE' }], optionalServices: [SERVICE_UUID] });
                    // Handle spontaneous disconnections seamlessly
                    bleDevice.addEventListener('gattserverdisconnected', () => {
                        document.getElementById('conn-msg').innerText = "LINK LOST - TAP TO RECONNECT";
                        document.getElementById('conn-msg').classList.remove('hidden');
                        document.getElementById('log-box').innerText = "SYSTEM OFFLINE";
                        charDirect = null;
                    });
                }
                const server = await bleDevice.gatt.connect();
                const service = await server.getPrimaryService(SERVICE_UUID);
                charDirect = await service.getCharacteristic(CHAR_UUID);
                
                document.getElementById('conn-msg').classList.add('hidden');
                charDirect.startNotifications();
                charDirect.addEventListener('characteristicvaluechanged', (e) => {
                    const str = new TextDecoder().decode(e.target.value);
                    if (str.startsWith("MSG:")) {
                        const msg = str.substring(4);
                        document.getElementById('log-box').innerText = "> " + msg;
                    } else {
                        const [m, d] = str.split(',');
                        if (d !== undefined) {
                            currentM = m;
                            document.getElementById('m-txt').innerText = m === 'M' ? "MANUAL" : "AUTO";
                            document.getElementById('d-txt').innerText = d + "cm";
                            document.getElementById('mode-a').classList.toggle('active', m === 'A');
                            document.getElementById('mode-m').classList.toggle('active', m === 'M');
                            document.getElementById('main-pad').classList.toggle('disabled', m === 'A');
                        }
                    }
                });
            } catch (err) { console.error(err); }
        }
        document.getElementById('conn-msg').onclick = connect;

        const bindControl = (id, c) => {
            const btn = document.getElementById(id);
            const act = (e) => { e.preventDefault(); if(currentM==='M') send(c); };
            const stop = (e) => { e.preventDefault(); if(currentM==='M') send('S'); };
            ['mousedown', 'touchstart'].forEach(ev => btn.addEventListener(ev, act));
            ['mouseup', 'mouseleave', 'touchend'].forEach(ev => btn.addEventListener(ev, stop));
        };
        bindControl('up', 'F'); bindControl('down', 'B'); bindControl('left', 'L'); bindControl('right', 'R');

        let isWriting = false;
        let msgQueue = [];
        
        async function send(msg) {
            if(!charDirect) return;
            
            // Queue the latest message. Overwrite array to prevent massive backlog latency
            msgQueue = [msg]; 
            
            if(isWriting) return;
            isWriting = true;
            
            while(msgQueue.length > 0) {
                let toSend = msgQueue.shift();
                try { 
                    // Safely dispatch to ESP32 buffer
                    await charDirect.writeValue(new TextEncoder().encode(toSend)); 
                } catch(exc) { 
                    console.error("BLE Write Error: ", exc); 
                }
            }
            isWriting = false;
        }
    </script>
</body>
</html>
