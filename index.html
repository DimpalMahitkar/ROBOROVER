<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ROBOROVER PRO | Joystick Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --glow: #00f2ff;
            --accent: #ff0055;
            --bg: #05070a;
            --card: rgba(16, 18, 27, 0.9);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; touch-action: none; }
        body {
            font-family: 'Rajdhani', sans-serif;
            background: var(--bg);
            color: #fff;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }

        body::before {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.2) 50%);
            background-size: 100% 2px;
            pointer-events: none;
            z-index: 100;
        }

        .dashboard {
            display: flex;
            flex-direction: column;
            width: 95%;
            max-width: 600px;
            gap: 20px;
            padding: 20px;
            background: var(--card);
            border: 1px solid rgba(0, 242, 255, 0.1);
            border-radius: 30px;
            backdrop-filter: blur(20px);
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            padding-bottom: 15px;
        }

        .title {
            font-family: 'Orbitron', sans-serif;
            color: var(--glow);
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .stats-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .stat-box {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 15px;
            padding: 15px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 700;
            color: var(--glow);
            text-shadow: 0 0 10px var(--glow);
        }

        .main-control {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 30px;
            padding: 20px 0;
        }

        /* Joystick Styles */
        #joystick-container {
            width: 200px;
            height: 200px;
            background: radial-gradient(circle, rgba(0, 242, 255, 0.05) 0%, rgba(0, 0, 0, 0.4) 70%);
            border: 2px solid rgba(0, 242, 255, 0.2);
            border-radius: 50%;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: inset 0 0 20px rgba(0, 242, 255, 0.1);
        }

        #joystick-knob {
            width: 70px;
            height: 70px;
            background: var(--glow);
            border-radius: 50%;
            position: absolute;
            cursor: pointer;
            box-shadow: 0 0 30px var(--glow);
            transition: transform 0.1s ease-out;
        }

        .mode-toggle { display: flex; gap: 10px; width: 100%; }
        .m-btn {
            flex: 1; padding: 12px; background: transparent; border: 1px solid #333;
            color: #666; border-radius: 10px; cursor: pointer; font-weight: 700;
            font-size: 0.8rem;
        }
        .m-btn.active { border-color: var(--glow); color: var(--glow); background: rgba(0, 242, 255, 0.1); }

        #connect-bar {
            position: fixed; top: 0; left: 0; width: 100%; height: 50px;
            background: var(--glow); color: #000;
            display: flex; align-items: center; justify-content: center;
            font-weight: 700; cursor: pointer; z-index: 1000;
        }

        .hidden { transform: translateY(-100%); }

        .radar-line {
            position: absolute; width: 100%; height: 1px; background: rgba(0, 242, 255, 0.1);
            top: 50%; left: 0;
        }
        .radar-line-v {
            position: absolute; width: 1px; height: 100%; background: rgba(0, 242, 255, 0.1);
            left: 50%; top: 0;
        }
    </style>
</head>
<body>
    <div id="connect-bar">CONNECT TO ROBOROVER</div>

    <div class="dashboard">
        <div class="header">
            <div class="title">System HUD</div>
            <div id="connection-status" style="color: var(--accent); font-size: 0.7rem;">DISCONNECTED</div>
        </div>

        <div class="stats-row">
            <div class="stat-box">
                <div style="font-size: 0.7rem; color: #888;">MISSION</div>
                <div class="stat-value" id="mode-text">OFFLINE</div>
            </div>
            <div class="stat-box">
                <div style="font-size: 0.7rem; color: #888;">SCANNER</div>
                <div class="stat-value" id="dist-text">-- CM</div>
            </div>
        </div>

        <div class="main-control">
            <div id="joystick-container">
                <div class="radar-line"></div>
                <div class="radar-line-v"></div>
                <div id="joystick-knob"></div>
            </div>
            <div style="font-size: 0.7rem; color: #444; text-transform: uppercase; letter-spacing: 2px;">Manual Flight Stick</div>
        </div>

        <div class="mode-toggle">
            <button class="m-btn active" id="m-manual" onclick="send('M')">MANUAL CONTROL</button>
            <button class="m-btn" id="m-auto" onclick="send('A')">AI AUTONOMOUS</button>
        </div>
    </div>

    <script>
        const SERVICE_UUID = "4fafc201-1fb5-459e-8fcc-c5c9c331914b";
        const CHAR_UUID = "beb5483e-36e1-4688-b7f5-ea07361b26a8";
        let device, char, lastCmd = 'S';

        async function initBLE() {
            try {
                device = await navigator.bluetooth.requestDevice({
                    filters: [{ name: 'ROBOROVER_BLE' }],
                    optionalServices: [SERVICE_UUID]
                });
                const server = await device.gatt.connect();
                const service = await server.getPrimaryService(SERVICE_UUID);
                char = await service.getCharacteristic(CHAR_UUID);
                
                document.getElementById('connect-bar').classList.add('hidden');
                document.getElementById('connection-status').innerText = "LINK ESTABLISHED";
                document.getElementById('connection-status').style.color = "#2ecc71";
                
                char.startNotifications();
                char.addEventListener('characteristicvaluechanged', (e) => {
                    const val = new TextDecoder().decode(e.target.value);
                    const [mode, dist] = val.split(',');
                    document.getElementById('mode-text').innerText = mode == 'M' ? "MANUAL" : "AUTO";
                    document.getElementById('dist-text').innerText = dist + " CM";
                });
            } catch (e) { alert(e.message); }
        }

        // Joystick Logic
        const container = document.getElementById('joystick-container');
        const knob = document.getElementById('joystick-knob');
        let active = false;

        container.addEventListener('touchstart', start, {passive: false});
        window.addEventListener('touchmove', move, {passive: false});
        window.addEventListener('touchend', end);

        function start(e) { active = true; move(e); }
        function end() { 
            active = false; 
            knob.style.transform = `translate(0, 0)`;
            send('S');
        }

        function move(e) {
            if (!active) return;
            e.preventDefault();
            const rect = container.getBoundingClientRect();
            const touch = e.touches[0];
            const x = touch.clientX - rect.left - rect.width/2;
            const y = touch.clientY - rect.top - rect.height/2;
            
            const limit = rect.width/2 - 35;
            const dist = Math.min(Math.sqrt(x*x + y*y), limit);
            const angle = Math.atan2(y, x);
            
            const nx = Math.cos(angle) * dist;
            const ny = Math.sin(angle) * dist;
            
            knob.style.transform = `translate(${nx}px, ${ny}px)`;

            // Map to commands
            let cmd = 'S';
            if (dist > 30) {
                const deg = angle * 180 / Math.PI;
                if (deg > -135 && deg < -45) cmd = 'F';
                else if (deg > 45 && deg < 135) cmd = 'B';
                else if (deg >= -45 && deg <= 45) cmd = 'R';
                else cmd = 'L';
            }
            
            if (cmd != lastCmd) {
                lastCmd = cmd;
                send(cmd);
            }
        }

        async function send(cmd) {
            if(!char) return;
            try {
                await char.writeValue(new TextEncoder().encode(cmd));
                if(cmd == 'A') { document.getElementById('m-auto').classList.add('active'); document.getElementById('m-manual').classList.remove('active'); }
                if(cmd == 'M') { document.getElementById('m-manual').classList.add('active'); document.getElementById('m-auto').classList.remove('active'); }
            } catch(e) {}
        }

        document.getElementById('connect-bar').onclick = initBLE;
    </script>
</body>
</html>
